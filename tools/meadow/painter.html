<!doctype html>
<html>
<head><meta charset="utf-8"><title>Meadow painter</title></head>
<body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script>
setTimeout(()=>{
// Procedural pastel "airbrushed meadow" background.
// Usage: painter.html?w=2400&h=1600&seed=7
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 2400, H = +q.get('h') || 1600, SEED = +q.get('seed') || 7;
const c = document.getElementById('c'); c.width = W; c.height = H;
const main = c.getContext('2d');
let ctx = main;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(SEED);
const R = (a,b)=>a+(b-a)*rnd();
const pick = arr => arr[Math.floor(rnd()*arr.length)];
const S = Math.min(W,H)/1600; // scale factor

// ---------- 1. Sky → haze → meadow gradient ----------
const g = ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0.00,'#8DBFE6');
g.addColorStop(0.18,'#B9CDEB');
g.addColorStop(0.34,'#F3C3CE');
g.addColorStop(0.52,'#F5B8BF');
g.addColorStop(0.70,'#E9B7A8');
g.addColorStop(0.84,'#A9C98A');
g.addColorStop(1.00,'#7FB466');
ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

function blob(x,y,r,color,alpha){
  const rg = ctx.createRadialGradient(x,y,0,x,y,r);
  rg.addColorStop(0,color); rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.globalAlpha = alpha; ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
}
// airbrushed colour clouds
for(let i=0;i<26;i++){
  const y = R(0.25,0.95)*H;
  blob(R(0,W), y, R(180,520)*S, pick(['#FFB3C7','#FFD0B5','#E6C8FF','#C9F0D8','#FFE7A8','#FFC2D6','#B9E0FF']), R(.18,.4));
}
// a soft blue streak in the sky (like the reference)
ctx.save(); ctx.filter=`blur(${40*S}px)`; ctx.globalAlpha=.35; ctx.fillStyle='#7FA9E0';
ctx.beginPath(); ctx.ellipse(W*R(.35,.6),H*.12,90*S,260*S,R(-.4,.4),0,Math.PI*2); ctx.fill(); ctx.restore();

// ---------- helpers ----------
// Draw fn() on an offscreen layer, then composite it onto the main canvas with ONE blur pass.
function withBlur(px, fn){
  const L=document.createElement('canvas'); L.width=W; L.height=H;
  const prev=ctx; ctx=L.getContext('2d'); fn(); ctx=prev;
  ctx.save(); ctx.filter = px>0?`blur(${px}px)`:'none'; ctx.drawImage(L,0,0); ctx.restore();
}
function stem(x,y,h,color,w,bend){
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,H+10); ctx.bezierCurveTo(x+bend*.3,H-(H-y)*.4, x+bend, y+h*.3, x+bend*.8, y); ctx.stroke();
  return [x+bend*.8,y];
}
function daisy(x,y,r,center='#F7C948',petal='#FFFFFF'){
  const n = Math.floor(R(14,22));
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+R(-.05,.05);
    ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.fillStyle=petal; ctx.globalAlpha=R(.8,1);
    ctx.beginPath(); ctx.ellipse(r*.55,0,r*.48,r*.14,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  ctx.globalAlpha=1; ctx.fillStyle='rgba(140,170,225,.45)'; ctx.beginPath(); ctx.arc(x,y,r*.42,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=center; ctx.beginPath(); ctx.arc(x,y,r*.28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#F0A93A'; ctx.beginPath(); ctx.arc(x+r*.05,y+r*.06,r*.14,0,Math.PI*2); ctx.fill();
}
function poppy(x,y,r,color){
  for(let i=0;i<5;i++){ const a=i/5*Math.PI*2+R(0,1);
    ctx.fillStyle=color; ctx.globalAlpha=R(.85,1);
    ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*r*.35,y+Math.sin(a)*r*.25,r*.62,r*.5,a,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1; ctx.fillStyle='rgba(60,20,40,.55)'; ctx.beginPath(); ctx.arc(x,y,r*.16,0,Math.PI*2); ctx.fill();
}
function spiky(x,y,r,color,center){
  const n=Math.floor(R(16,28)); ctx.strokeStyle=color; ctx.lineCap='round';
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; ctx.lineWidth=R(2,4)*S;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*r*R(.7,1),y+Math.sin(a)*r*R(.7,1)); ctx.stroke(); }
  if(center){ ctx.fillStyle=center; ctx.beginPath(); ctx.arc(x,y,r*.22,0,Math.PI*2); ctx.fill(); }
}
function cup(x,y,r,color){ // cornflower / tulip-like cup
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.moveTo(x-r,y-r*.2);
  for(let i=0;i<=6;i++){ const px=x-r+i*(2*r/6); ctx.lineTo(px, y-r*(i%2?0.9:0.35)); }
  ctx.quadraticCurveTo(x+r*.8,y+r*.6,x,y+r*.7); ctx.quadraticCurveTo(x-r*.8,y+r*.6,x-r,y-r*.2); ctx.fill();
}
function disc(x,y,r,color,center){ ctx.fillStyle=color; ctx.beginPath(); ctx.ellipse(x,y,r,r*.62,R(-.3,.3),0,Math.PI*2); ctx.fill();
  ctx.fillStyle=center; ctx.beginPath(); ctx.ellipse(x,y,r*.32,r*.22,0,0,Math.PI*2); ctx.fill(); }
function spike(x,y,h,color){ // lupin / lavender spike
  for(let i=0;i<22;i++){ const t=i/22; ctx.fillStyle=color; ctx.globalAlpha=R(.6,1);
    ctx.beginPath(); ctx.ellipse(x+R(-6,6)*S*(1-t), y+t*h, (7-5*t)*S+2, (4-2*t)*S+1.5, R(-1,1), 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}
function fern(x,y,h,color){ ctx.strokeStyle=color; ctx.lineWidth=2*S;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+R(-10,10)*S,y+h); ctx.stroke();
  for(let i=0;i<18;i++){ const yy=y+i/18*h, l=(8+i*1.4)*S;
    ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x-l,yy-l*.5); ctx.moveTo(x,yy); ctx.lineTo(x+l,yy-l*.5); ctx.stroke(); }
}
function dots(x,y,n,color){ for(let i=0;i<n;i++){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x+R(-30,30)*S,y+R(-40,40)*S,R(2,5)*S,0,Math.PI*2); ctx.fill(); } }

const FLOWERS = [
  (x,y,r)=>daisy(x,y,r),
  (x,y,r)=>daisy(x,y,r*.8,'#FFE07A','#FFF6FA'),
  (x,y,r)=>poppy(x,y,r,pick(['#E8443A','#F25C54','#EF4F5F'])),
  (x,y,r)=>poppy(x,y,r*.8,pick(['#FF7FA6','#FF9BB8','#F48FB1'])),
  (x,y,r)=>spiky(x,y,r,pick(['#FF8FB1','#F06292','#FFB3C6']),'#FFD86B'),
  (x,y,r)=>spiky(x,y,r*.9,pick(['#4F7DDB','#5B8DEF','#3E6FD8']),'#283F8F'),
  (x,y,r)=>cup(x,y,r*.7,pick(['#3D6FE0','#5B8DEF','#7FA8F5'])),
  (x,y,r)=>disc(x,y,r*.9,pick(['#FFD23F','#FFC93C','#FFB347']),pick(['#3E6FD8','#E65A3A'])),
  (x,y,r)=>{ spiky(x,y,r,'#FF7A3D'); disc(x,y,r*.45,'#FFD23F','#FF8A3D'); },
];

// ---------- 2. Background layer: tall wispy grasses & spikes (far, blurred) ----------
withBlur(5*S, ()=>{
  for(let i=0;i<34;i++){ const x=R(0,W), y=R(.12,.55)*H;
    ctx.globalAlpha=R(.25,.5);
    stem(x,y,H-y, pick(['#7FA36A','#93B57F','#9EB3D6','#C49BB8']), R(1.2,2.4)*S, R(-60,60)*S);
    const r=rnd();
    if(r<.3) spike(x+R(-20,20)*S,y,R(60,140)*S,pick(['#E25A7A','#7E8FE0','#C86BA8','#E6735C']));
    else if(r<.55) fern(x,y,R(120,260)*S,'#6F9A63');
    else if(r<.8) dots(x,y,R(4,10),pick(['#E63946','#F4A259','#9D4EDD']));
  }
  ctx.globalAlpha=1;
});
// floating seeds / petals in the sky
withBlur(2*S, ()=>{
  for(let i=0;i<9;i++){ const x=R(.1,.9)*W, y=R(.03,.3)*H, r=R(10,26)*S;
    ctx.fillStyle=pick(['#F25C54','#FFC93C','#4F9D69','#5B8DEF','#FFFFFF','#B23A48']); ctx.globalAlpha=R(.7,.95);
    ctx.beginPath(); ctx.ellipse(x,y,r,r*.62,R(0,3),0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
});

// ---------- 2b. Painterly colour masses (bushes) so the meadow has no gaps ----------
withBlur(28*S, ()=>{
  for(let i=0;i<110;i++){ const t=Math.pow(rnd(),.6), y=H*(.5+.5*t);
    ctx.fillStyle=pick(['#7FB466','#8FC27A','#A6D08C','#F7A8C0','#FF9EB0','#F7B9A0','#C9B3F0','#FFD27A','#6FAE5E']);
    ctx.globalAlpha=R(.25,.55);
    ctx.beginPath(); ctx.ellipse(R(-.05,1.05)*W,y,R(60,190)*S,R(40,120)*S,R(0,3),0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
});

// ---------- 3. Mid & front flowers (depth: higher = smaller + blurrier) ----------
const items=[];
for(let i=0;i<300;i++){ const t=Math.pow(rnd(),.55); const y=H*(.42+.6*t); items.push({x:R(-.02,1.02)*W,y,t}); }
items.sort((a,b)=>a.y-b.y);
const BANDS=5;
for(let b=0;b<BANDS;b++){
  const band=items.filter(it=>Math.min(BANDS-1,Math.floor(it.t*BANDS))===b);
  const tMid=(b+.5)/BANDS, blur=(4.5-3*tMid)*S;
  withBlur(blur, ()=>{
    for(const it of band){
      const r=(18+92*Math.pow(it.t,1.4))*S*R(.75,1.25);
      ctx.globalAlpha=R(.45,.75);
      stem(it.x, it.y, H-it.y, pick(['#5E9A57','#6FAE5E','#4E8A50','#79B36A']), (1.5+2*it.t)*S, R(-30,30)*S);
      ctx.globalAlpha=1;
      if(rnd()<.45){ ctx.fillStyle=pick(['#6FAE5E','#8FC27A','#5E9A57']); ctx.globalAlpha=.8;
        ctx.beginPath(); ctx.ellipse(it.x+R(-15,15)*S, it.y+R(40,140)*S, r*.25, r*.9, R(-.8,.8),0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
      pick(FLOWERS)(it.x, it.y, r);
    }
  });
}

// ---------- 4. Front grass haze ----------
withBlur(6*S, ()=>{
  for(let i=0;i<160;i++){ const x=R(0,W), y=R(.86,1)*H;
    ctx.globalAlpha=R(.25,.55); ctx.strokeStyle=pick(['#5E9A57','#7FB466','#9BCB7F','#4E8A50']); ctx.lineWidth=R(3,7)*S;
    ctx.beginPath(); ctx.moveTo(x,H+20); ctx.quadraticCurveTo(x+R(-20,20)*S,y+40*S,x+R(-40,40)*S,y); ctx.stroke(); }
  ctx.globalAlpha=1;
});

// ---------- 5. Overall airbrush softness + pastel haze ----------
const snap=document.createElement('canvas'); snap.width=W; snap.height=H; snap.getContext('2d').drawImage(c,0,0);
ctx.clearRect(0,0,W,H); ctx.filter=`blur(${2.2*S}px)`; ctx.drawImage(snap,0,0);
ctx.globalCompositeOperation='screen'; ctx.globalAlpha=.28; ctx.filter=`blur(${22*S}px)`; ctx.drawImage(snap,0,0);
ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; ctx.filter='none';
const haze=ctx.createLinearGradient(0,0,0,H);
haze.addColorStop(0,'rgba(255,240,245,0.10)'); haze.addColorStop(.45,'rgba(255,225,232,0.22)'); haze.addColorStop(1,'rgba(255,255,255,0.04)');
ctx.fillStyle=haze; ctx.fillRect(0,0,W,H);

// ---------- 6. Film grain ----------
const img=ctx.getImageData(0,0,W,H), d=img.data;
for(let i=0;i<d.length;i+=4){ const n=(rnd()-.5)*26; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
ctx.putImageData(img,0,0);
window.__done = true;
}, 0);
</script>
</body>
</html>
